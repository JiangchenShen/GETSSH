[package]
name = "nexus-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.0", features = ["async", "serde-json"] }
napi-derive = "3.6.10"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }

[build-dependencies]
napi-build = "2.1.3"

[package]
name = "getssh-keystore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The standalone getssh-keystore.node (scripts/build-native.js passes --features napi).
# getssh-store links this crate without it, so the N-API exports are not registered twice.
napi = ["dep:napi", "dep:napi-derive"]
# The software device from src/device/fake.rs, for getssh-store's tests. Never in a build.
fake-device = []

[dependencies]
napi = { version = "3.14.0", optional = true }
napi-derive = { version = "3.6.10", optional = true }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
hkdf = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdh", "std"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
subtle = "2.5"
unicode-normalization = "0.1.24"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

# Device keys on Windows (src/device/windows.rs): TPM through NCrypt, DPAPI, Windows Hello.
# 0.57 is the version already in the workspace lock.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT async operations (IAsyncOperation, .join()) live here since windows 0.59.
windows-future = "0.3.2"

[build-dependencies]
napi-build = "2.3.2"

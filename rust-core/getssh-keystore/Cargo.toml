[package]
name = "getssh-keystore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4"] }
napi-derive = "2.16.13"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
hkdf = "0.12.4"
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "ecdh", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
subtle = "2.5"
unicode-normalization = "0.1.24"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

# Device keys on Windows (src/device/windows.rs): TPM through NCrypt, DPAPI, Windows Hello.
# 0.57 is the version already in the workspace lock.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57.0", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2.3.2"

[package]
name = "getssh-unarchive"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.0", features = ["tokio_rt"] }
napi-derive = "3.6.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "time"] }
tokio = { version = "1.0", features = ["fs", "rt"] }

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
strip = "symbols"
opt-level = "z"

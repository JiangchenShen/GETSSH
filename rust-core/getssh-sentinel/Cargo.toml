[package]
name = "getssh-sentinel"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.14.0"
napi-derive = "3.6.10"
regex = "1.10"
lazy_static = "1.4"
uuid = { version = "1.4", features = ["v4"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"

[build-dependencies]
napi-build = "2.0.1"

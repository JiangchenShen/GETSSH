[package]
name = "ocean-sentinel"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "watchdog"
path = "src/watchdog/main.rs"

[[bin]]
name = "getssh-sandbox"
path = "src/sandbox/main.rs"

[features]
default = ["native"]
native = ["dep:napi", "dep:napi-derive", "dep:regex", "dep:lazy_static", "dep:uuid", "dep:tree-sitter", "dep:tree-sitter-bash", "dep:napi-build"]

[dependencies]
napi = { version = "3.14.0", optional = true }
napi-derive = { version = "3.6.10", optional = true }
regex = { version = "1.10", optional = true }
lazy_static = { version = "1.4", optional = true }
uuid = { version = "1.4", features = ["v4"], optional = true }
tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "winnt", "handleapi", "memoryapi", "minwindef", "libloaderapi"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[build-dependencies]
napi-build = { version = "2.0.1", optional = true }

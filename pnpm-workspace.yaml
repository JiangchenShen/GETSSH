allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  ssh2: true
ignoreScripts: false
ignoredOptionalDependencies:
  - cpu-features
packages:
  - '.'
  - 'rust-core/*'
  - 'apps/*'
  - 'packages/*'
overrides:
  # Security fixes the direct dependencies do not pull in yet (docs/dependency-upgrade-plan.md).
  js-yaml@^4: ^4.3.2
  # Electron 44 needs node-abi 4.33+, or install-app-deps cannot detect its ABI.
  node-abi@^4: ^4.35.0
  # Build tools only (electron-builder's Electron download; Vite and Tailwind source maps; the
  # selector parser of @tailwindcss/typography, which pins 6.0.10 up to its latest 0.5.20):
  # GHSA advisories fixed in these releases, which the direct dependencies do not pull in yet.
  http-cache-semantics@^4: ^4.3.0
  source-map-js@^1: ^1.2.2
  postcss-selector-parser@^6: ^6.1.5
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch

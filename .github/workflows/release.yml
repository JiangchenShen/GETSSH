name: Release GETSSH v3.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            eb_target: --mac --x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            arch: arm64
            eb_target: --mac --arm64
            rust_target: aarch64-apple-darwin
          - os: windows-2022
            arch: x64
            eb_target: --win --x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            eb_target: --win --arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        working-directory: apps/getssh-client
        run: pnpm exec tsc -b tsconfig.json --force --pretty false

      - name: Build Rust N-API Addons
        run: node scripts/build-native.js
        env:
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Verify Native Modules Built
        run: |
          echo "=== Built .node files ==="
          find rust-core -name "*.node" -type f
          echo "========================="
        shell: bash

      - name: Build Native Process Tools
        run: |
          cargo build --release --target ${{ matrix.rust_target }} -p watchdog -p getssh-process-sandbox
          mkdir -p target/release
          if [ -f "target/${{ matrix.rust_target }}/release/watchdog.exe" ]; then
            cp "target/${{ matrix.rust_target }}/release/watchdog.exe" "target/release/watchdog.exe"
            cp "target/${{ matrix.rust_target }}/release/getssh-sandbox.exe" "target/release/getssh-sandbox.exe"
          elif [ -f "target/${{ matrix.rust_target }}/release/watchdog" ]; then
            cp "target/${{ matrix.rust_target }}/release/watchdog" "target/release/watchdog"
            chmod +x "target/release/watchdog"
          fi
        shell: bash

      - name: Build and Package Electron App
        run: |
          pnpm exec vite build
          pnpm exec electron-builder --publish never ${{ matrix.eb_target }}
        working-directory: apps/getssh-client
        shell: bash

      - name: Smoke-test Packaged App (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/getssh-client
        run: npm run test:packaged-startup

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          draft: true
          prerelease: false
